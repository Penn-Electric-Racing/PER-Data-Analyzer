[project]
name = "perda"
description = "Penn Electric Racing Data Analyzer"
authors = [
    {name = "laytcai", email = "1715782167@qq.com"},
    {name = "Penn Electric Racing Software"}
]
readme = "README.md"
requires-python = ">=3.13"
dynamic = ["dependencies", "version"]

[project.optional-dependencies]
semantic = [
    "sentence-transformers",
]
notebook = [
    "anywidget",
    "ipykernel",
    "ipywidgets",
    "nbformat",
]
docs = [
    "autodoc-pydantic==2.2.0",
    "pydata-sphinx-theme==0.16.1",
    "sphinx-autodoc-typehints==3.5.2",
    "sphinx-copybutton==0.5.2",
    "sphinx-design==0.6.1",
    # sphinx not included to avoid backward compatibility issues;
    # the necessary version is inferred from these extensions
]
full = [
    "perda[semantic]",
    "perda[notebook]",
    "perda[docs]",
]

[tool.setuptools.packages.find]
include = ["perda*"]

[tool.setuptools.package-data]
perda = ["py.typed"]

[tool.setuptools_scm]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[build-system]
requires = ["setuptools >= 64", "setuptools-scm >= 8", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
pythonpath = ["."]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = [
    "E4",    # pycodestyle: import placement (e.g. imports not at top of file)
    "E7",    # pycodestyle: statement errors (e.g. bare except, lambda assignment)
    "E9",    # pycodestyle: syntax / IO errors
    "F",     # pyflakes: unused imports and variables, undefined names
    "I",     # isort: import sorting
    "D",     # pydocstyle: docstring presence and formatting (numpy convention below)
    "W505",  # docstring / comment line length (limit set by max-doc-length below)
]
ignore = [
    "D100",  # missing module docstring
    "D104",  # missing package (__init__.py) docstring
    "D105",  # missing docstring on dunder methods
    "D401",  # imperative mood on the first line: too opinionated
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "F403"]  # re-exports and star imports are intentional
"conftest.py" = ["F401", "F403"]  # fixtures are pulled in by star import
"tests/**" = ["D"]                # tests don't need docstrings
"notebooks/**" = ["D"]            # notebooks don't need docstrings
"docs/**" = ["D", "E402"]         # Sphinx config edits sys.path before importing

[tool.ruff.lint.pycodestyle]
max-doc-length = 120

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.mypy]
files = ["perda"]

[[tool.mypy.overrides]]
module = [
    "numba",
    "scipy.*",
    "plotly.*",
    "ipywidgets",
    "ipywidgets.*",
    "faiss",
    "sentence_transformers",
]
ignore_missing_imports = true
