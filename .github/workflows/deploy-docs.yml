name: Deploy Documentation
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.13"

      - name: Install Pandoc
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc

      - name: Install dependencies
        run: |
          pip install -r requirements-dev.txt
          pip install -e .

      # Generate documentation
      - name: Build Documentation
        run: |
          cd docs
          sphinx-build -b html source build

      # The docs_index extension writes docs_index.json during the text build
      - name: Build Docs Index
        run: |
          cd docs
          sphinx-build -b text source build_index

      - name: Publish Docs Index
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view docs-index || gh release create docs-index \
            --title "Docs index" --latest=false \
            --notes "The API docs as plain text, one entry per object, rebuilt from main on every push."
          gh release upload docs-index docs/build_index/docs_index.json --clobber

      # Deploy to gh-pages branch of this repo
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs/build
